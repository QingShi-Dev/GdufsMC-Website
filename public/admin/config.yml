# =============================================================================
# Sveltia CMS 配置 — GdufsMC 站点新闻 / 内容后台
# =============================================================================
#
# ⚠️  首次使用前必读:
#
# 1. 后端 (backend) — 必须用 GitHub OAuth App, 不要用 PAT:
#    为什么不用 PAT: PAT 长期有效, 浏览器 localStorage 一旦泄露 = 永久仓库写权限.
#    OAuth 用短期 access token (数小时) + 一键撤销, 爆炸半径小得多.
#
#    注册 OAuth App 步骤 (5 min):
#      1. 打开 https://github.com/settings/applications/new
#      2. Application name: GdufsMC CMS (随便填)
#      3. Homepage URL: https://<your-domain>     ← 跟下面 base_url 一致
#      4. Authorization callback URL: https://<your-domain>/admin/
#         ⚠️ callback 末尾必须有 /, 跟 Sveltia redirect_uri 一致
#      5. 点 "Register application"
#      6. 复制 "Client ID" → 填到下面 backend.app_id
#      7. (不要填 Client Secret — Sveltia 用 PKCE 公开客户端, 不需要 secret)
#
#    ⚠️ 注册后一定要在 GitHub repo 上配 branch protection on `main`:
#      Settings → Branches → Add rule → 选 main
#      勾: Require a pull request before merging (1 approver)
#           Require status checks (CI typecheck + lint + build)
#           Include administrators
#      即使 token 泄露, 攻击者也只能开 PR, admin review 拦截.
#
#    Sveltia 用 PKCE 公开客户端模式 (RFC 7636), 不需要 Client Secret:
#      - 不在服务器存 secret, 整个 OAuth flow 在浏览器完成
#      - GitHub 端拿不到 Client Secret 也能跑 (OAuth App 默认公开客户端)
#
# 2. CSP 兼容性:
#    next.config.ts 已经把 unpkg.com / api.github.com / avatars.githubusercontent.com
#    加进了白名单, 否则浏览器会拦截 Sveltia 的脚本和 API 调用
#
# 3. 内容物理位置:
#    新闻 → content/news/*.md (frontmatter + Markdown 正文)
#    列表/详情页通过 @/lib/news 读取, slug 由 title 经 pinyin-pro 派生
#
# =============================================================================

backend:
  name: github
  repo: QingShi-Dev/GdufsMC-Website # 实际仓库 (owner/repo)
  branch: main # 实际发布分支

# 编辑界面本地化 (中文)
locale: zh-Hans

# 媒体 (图片) 上传
# 所有新闻图片统一池子: content/news/images/<hash>.webp
# Sveltia 默认 hash 文件名, 自动避免冲突
# Sveltia 自带 Asset Library (侧边栏 Alt+2) 浏览/删除/上传
media_folder: content/news/images
public_folder: /content/news/images

# -----------------------------------------------------------------------------
# 内容集合
# -----------------------------------------------------------------------------
collections:
  # 新闻动态
  - name: news
    label: 新闻动态
    label_singular: 一条新闻
    description: 网站首页 / /news 页展示的新闻文章, Markdown 格式
    folder: content/news
    create: true
    delete: true
    # URL slug 改成手动填写 (在 fields 里第一个字段)
    #   - 旧 news 没 slug 字段 (fallback 到 pinyin 派生)
    #   - 新 news 必须填 slug (小写英文/数字/短横线)
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    fields: # 对应 lib/news.ts 的 NewsFrontmatter
      - name: slug
        label: URL slug
        widget: string
        hint: '英文/拼音/短横线, 例: welcome-to-alpha-test。改了不会迁移旧 URL, 小心外链失效'
        pattern: ['^[a-z0-9][a-z0-9-]*[a-z0-9]$', '只能小写字母/数字/短横线, 不能以 - 开头/结尾']
      - name: title
        label: 标题
        widget: string
        hint: 文章标题, 用于显示
      - name: date
        label: 发布日期
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        format: YYYY-MM-DD
      - name: category
        label: 分类
        widget: select
        options:
          - { label: 公告, value: 公告 }
          - { label: 更新, value: 更新 }
          - { label: 活动, value: 活动 }
          - { label: 公告-维护, value: 公告-维护 }
        default: 公告
      - name: summary
        label: 一句话简介
        widget: text
        hint: 列表 + 轮播图副文字都用, 控制在 1-2 行
      - name: cover
        label: 封面图
        widget: image
        # Sveltia CMS 不支持 allow_multiple, 用 multiple 代替 (默认 false)
        multiple: false
        # 字段级 media_folder 模板 {{slug}} 在 Sveltia 0.215 是回归 bug (issue #74), 不解析
        # 直接用全局配置: images/news/<hash>.webp
        hint: 推荐 16:10 或更宽, 会用作列表缩略图 + 顶部轮播图
      - name: badge
        label: 轮播图标签 (可选)
        widget: string
        required: false
        hint: 例如 "最新" / "限时", 显示在轮播图右上角红色徽章
      - name: pinned
        label: 精选 (顶部轮播)
        widget: boolean
        default: false
        hint: 开启后会在首页 / 新闻页顶部轮播图优先展示
      - name: body
        label: 正文
        widget: markdown
        # markdown widget 内嵌图也走全局 (Sveltia 0.215 字段级模板不解析)
        hint: 支持 GFM (表格/任务列表/删除线), 可插入图片

  # 小游戏积分榜 — 单文件 collection, 整个榜单存一个 YAML
  - name: leaderboard
    label: 小游戏积分榜
    description: 网站 /news 页右侧的积分榜, 单文件结构, 修改后即时生效
    files:
      - name: data
        label: 榜单数据
        file: content/leaderboard/index.yml
        fields:
          - name: title
            label: 卡片标题
            widget: string
            hint: 卡片头部显示的标题, 可加 emoji
          - name: subtitle
            label: 副标题
            widget: string
            hint: 副标题, 例如"更新于 2026-09-18 06:00"
          - name: entries
            label: 选手列表
            widget: list
            hint: 选手条目, 按 rank 升序展示, rank=1 在最上
            fields:
              - name: rank
                label: 排名
                widget: number
                value_type: int
                min: 1
                hint: 1-based 排名
              - name: player
                label: 玩家名
                widget: string
                hint: MC 用户名
              - name: score
                label: 分数
                widget: number
                value_type: int
                min: 0
                hint: 当前积分
              - name: change
                label: 相对昨日变化
                widget: select
                options:
                  - { label: "↑ 上升", value: up }
                  - { label: "↓ 下降", value: down }
                  - { label: "— 持平", value: same }
                default: same
