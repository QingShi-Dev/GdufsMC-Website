# =============================================================================
# GitHub Actions — 部署到校园服务器 (self-hosted runner + Caddy)
# =============================================================================
# 架构变更 (vs. 旧 ECS + rsync + nginx):
#   旧: GitHub-hosted runner build → rsync 到服务器 → SSH 重启 PM2
#   新: Self-hosted runner (装在校园服务器上) build + 重启都在本机
#       - 无需 inbound SSH (GitHub Runner 走 outbound 443 出站)
#       - 校园网 NAT 友好, 不依赖公网 SSH 端口
#       - 取消 SSH secrets (SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY)
#       - 文件在 runner 本机直接访问, 不需 upload-artifact 中转
#
# Runner 配置: Settings → Actions → Runners → New self-hosted runner
#   - 标签: self-hosted, windows, gdufsmc
#   - 装到校园服务器 C:\actions-runner\
#   - 装成 Windows 服务 (deploy\setup.ps1 自动做)
#
# 触发: push 到 main (Sveltia CMS 编辑完提交也算)
# =============================================================================

name: Deploy to production

on:
  push:
    branches: [main]
  # 手动重跑 — 修部署脚本时用
  workflow_dispatch:
    inputs:
      reason:
        description: '重跑原因 (写到 commit message)'
        required: false
        default: 'manual'

# 不要并发跑两个部署 (新 commit 触发时旧的会被取消或排队)
concurrency:
  group: production-deploy
  cancel-in-progress: false    # 跑完当前的再跑下一个, 别 kill 正在跑的

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build + 校验 (push 和手动触发都跑)
  # ---------------------------------------------------------------------------
  build:
    name: Build & validate
    # GitHub-hosted runner, 跟项目其他 CI 一致 (build 验证 + 校验)
    # 校园服务器跑 deploy 时不再 build, 用 artifact 下载 — build 失败就不到 deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # build 产物打成包, 传到下一 job
      # 不含 node_modules / .git / .next/cache — 服务器自己装 prod 依赖
      - name: Stage build for transfer
        run: |
          mkdir -p build-out
          cp -r .next build-out/next-build
          cp -r public build-out/public
          cp package.json pnpm-lock.yaml next.config.ts proxy.ts build-out/
          cp -r deploy build-out/deploy
          cp Caddyfile build-out/Caddyfile
          cp -r content build-out/content

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdufsmc-build
          path: build-out/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: deploy — self-hosted runner 直接在校园服务器跑
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    needs: build
    # 关键变更: 改 self-hosted, 校园服务器上的 runner
    runs-on: [self-hosted, windows, gdufsmc]
    if: github.event_name == 'push'
    timeout-minutes: 15
    environment:
      name: production
      # 显示在 Actions 摘要里 (域名硬编码, runner 在校园服务器本地访问不需要 secrets)
      url: https://gdufscraft.top

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gdufsmc-build
          path: ${{ github.workspace }}\artifacts

      - name: Deploy build output to project root
        shell: pwsh
        run: |
          $ProjectDir = 'H:\GDUFSMC-web'
          $ArtifactsDir = Join-Path ${{ github.workspace }} 'artifacts'

          # 重命名 next-build → .next (绕开 upload-artifact 吃 .next 内容)
          if (Test-Path (Join-Path $ArtifactsDir 'next-build')) {
              if (Test-Path (Join-Path $ProjectDir '.next')) {
                  Remove-Item -Recurse -Force (Join-Path $ProjectDir '.next')
              }
              Move-Item (Join-Path $ArtifactsDir 'next-build') (Join-Path $ProjectDir '.next')
              Write-Host "✅ .next deployed (BUILD_ID = $((Get-Content (Join-Path $ProjectDir '.next\BUILD_ID')).Trim()))"
          } else {
              throw "❌ artifacts/next-build 不存在, build 可能失败"
          }

          # 同步 public / content / package.json / config / deploy / Caddyfile
          Copy-Item -Recurse -Force (Join-Path $ArtifactsDir 'public') $ProjectDir
          Copy-Item -Recurse -Force (Join-Path $ArtifactsDir 'content') $ProjectDir
          Copy-Item -Force (Join-Path $ArtifactsDir 'package.json') $ProjectDir
          Copy-Item -Force (Join-Path $ArtifactsDir 'pnpm-lock.yaml') $ProjectDir
          Copy-Item -Force (Join-Path $ArtifactsDir 'next.config.ts') $ProjectDir
          Copy-Item -Force (Join-Path $ArtifactsDir 'proxy.ts') $ProjectDir
          Copy-Item -Recurse -Force (Join-Path $ArtifactsDir 'deploy') $ProjectDir
          Copy-Item -Force (Join-Path $ArtifactsDir 'Caddyfile') $ProjectDir
          # NOTE: secrets.caddy (basic auth 密码哈希) 在 .gitignore, 不会被 artifact 打包,
          #       也不会被覆盖 — 服务器本地维护, 永不进 git
          Write-Host "✅ public / content / configs / deploy / Caddyfile 同步完成"

      - name: Install production dependencies
        shell: pwsh
        working-directory: H:\GDUFSMC-web
        run: pnpm install --prod --frozen-lockfile

      - name: Sync favicon to static path (Caddy /favicon.ico 固定路径)
        shell: pwsh
        run: |
          $ProjectDir = 'H:\GDUFSMC-web'
          $favicon = Get-ChildItem -Path "$ProjectDir\.next\static\media\favicon.*.ico" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($favicon) {
              New-Item -ItemType Directory -Path "$ProjectDir\app" -Force | Out-Null
              Copy-Item -Force $favicon.FullName "$ProjectDir\app\favicon.ico"
              Write-Host "✅ favicon 同步: $($favicon.Name) → app/favicon.ico"
          } else {
              Write-Warning "⚠️ 找不到 favicon, /favicon.ico 可能 404"
          }

      - name: Restart PM2 (Next.js)
        shell: pwsh
        run: |
            $ErrorActionPreference = 'Continue'
            pm2 delete gdufsmc 2>$null
            pm2 start deploy/ecosystem.config.js
            pm2 save | Out-Null

      - name: Health check (wait for Next.js bind port 3000)
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 3
              try {
                  $r = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/' -UseBasicParsing -TimeoutSec 5
                  if ($r.StatusCode -eq 200) {
                      Write-Host "✅ 主页就绪 (等了 $($i * 3)s)"
                      $ok = $true
                      break
                  }
              } catch {
                  # 服务器还没起来, 继续等
              }
          }
          if (-not $ok) {
              Write-Error "❌ 主页 30s 内未就绪"
              pm2 logs gdufsmc --lines 50 --nostream --raw
              exit 1
          }

          try {
              $api = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/api/server-status' -UseBasicParsing -TimeoutSec 5
              Write-Host "✅ API 状态: HTTP $($api.StatusCode)"
          } catch {
              Write-Warning "⚠️ API 健康检查失败, 但主页正常"
          }

      - name: Reload Caddy (only if Caddyfile changed)
        shell: pwsh
        run: |
          # git log 在 actions workspace 里执行不是项目目录, 用 Push-Location 切到 H:\GDUFSMC-web
          Push-Location H:\GDUFSMC-web
          $changed = (git diff HEAD~1 HEAD --name-only 2>$null) | Where-Object { $_ -eq 'Caddyfile' }
          Pop-Location

          if ($changed -and (Get-Service -Name 'Caddy' -ErrorAction SilentlyContinue)) {
              # 自动检测 Caddy 路径 (支持 winget / scoop / choco / 手动安装)
              $caddy = Get-Command caddy -ErrorAction SilentlyContinue
              if (-not $caddy) {
                  $candidates = @(
                      'C:\Program Files\Caddy\caddy.exe',
                      "$env:USERPROFILE\scoop\apps\caddy\current\caddy.exe"
                  )
                  $caddyExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
                  if ($caddyExe) { $caddy = @{ Source = $caddyExe } }
              }
              if ($caddy) {
                  & $caddy.Source reload --config 'H:\GDUFSMC-web\Caddyfile'
                  Write-Host "✅ Caddy 重载 (Caddyfile 变更)"
              } else {
                  Write-Warning "⚠️ 找不到 caddy.exe, 跳过 reload"
              }
          } else {
              Write-Host "⏭️ 跳过 Caddy reload (Caddyfile 未变 或服务未启动)"
          }