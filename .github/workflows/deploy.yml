# Transition: build on GitHub, publish manually as the existing PM2 owner.
# Never run install/build or change services on the production runner.
name: Build release (manual publish)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Pin pnpm
        run: |
          npm install --global pnpm@12.5.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
      - name: Install full build dependencies
        run: |
          pnpm install --prod=false --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and lint
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package release
        run: node scripts/package-release.mjs
      - name: Test extracted archive (not source workspace)
        run: |
          $archive = @(Get-ChildItem outputs/*.tar.gz)
          if ($archive.Count -ne 1) { throw 'Expected one release archive' }
          New-Item -ItemType Directory .release-smoke -ErrorAction Stop | Out-Null
          tar -xzf $archive[0].FullName -C .release-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-release.mjs .release-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified release and manual publisher
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            outputs/*.tar.gz
            outputs/*.sha256.txt
            deploy/publish-release.ps1
            deploy/README.md
