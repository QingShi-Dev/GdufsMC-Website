# Code builds stay on GitHub. The server runner submits content requests or
# full release ZIPs to separate administrator tasks; it never operates PM2.
name: Deliver content or build release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full_build:
        description: 'Build a full release without using the server content queue'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  content:
    if: github.ref == 'refs/heads/main' && vars.CONTENT_SYNC_ENABLED == 'true' && inputs.force_full_build != true
    runs-on: [self-hosted, Windows, X64, gdufsmc]
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.sync.outputs.mode }}
    steps:
      # No checkout: a content commit must never replace the trusted worker.
      - name: Submit content request and wait for the administrator task
        id: sync
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          REQUEST_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
          # Report the credential as a length only. An empty value here means
          # the token never reached the process, which is indistinguishable
          # from a rejected credential without this line.
          Write-Host "GITHUB_TOKEN length: $($env:GITHUB_TOKEN.Length)"
          & 'C:/Program Files/nodejs/node.exe' 'H:/GDUFSMC-web/content-tools/scripts/content-sync.mjs' enqueue --config 'H:/GDUFSMC-web/content-tools/config.json' --candidate $env:CANDIDATE_COMMIT --request-id $env:REQUEST_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build:
    needs: content
    if: always() && github.ref == 'refs/heads/main' && (needs.content.result == 'skipped' || (needs.content.result == 'success' && needs.content.outputs.mode == 'full'))
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      release_artifact_id: ${{ steps.release.outputs.artifact-id }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Pin pnpm
        run: |
          npm install --global pnpm@12.5.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
      - name: Install full build dependencies
        run: |
          # Build from a real hoisted tree: dereferencing an isolated pnpm
          # layout relocates packages away from their sibling dependencies.
          pnpm install --prod=false --frozen-lockfile --config.node-linker=hoisted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and lint
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate content and regression tests
        run: |
          pnpm test:content
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-content-root.mjs . --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -File scripts/test-content-operations.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -File scripts/test-content-activation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -File scripts/test-content-purge.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test automatic release preparation and delivery
        run: |
          powershell -NoProfile -NonInteractive -File scripts/test-artifact-publish.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -NonInteractive -File scripts/test-artifact-publish.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package standalone trusted content tools
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "content-sync-tools-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node scripts/package-content-tools.mjs $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
          node (Join-Path $tools 'scripts/verify-content-root.mjs') $env:GITHUB_WORKSPACE --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload trusted content tools for administrator installation
        uses: actions/upload-artifact@v4
        with:
          name: content-sync-tools-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/content-sync-tools-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
      - name: Build standalone
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned CMS vendor bundle
        timeout-minutes: 12
        env:
          CMS_COMMIT: 38d382dfc6b2c7ec471f6724f42c889df91396ae
          CMS_VERSION: 0.227.0
        run: |
          $ErrorActionPreference = 'Stop'
          $cmsRoot = Join-Path $env:RUNNER_TEMP "sveltia-cms-$env:CMS_VERSION"
          $archive = Join-Path $env:RUNNER_TEMP "sveltia-cms-$env:CMS_COMMIT.tar.gz"
          Invoke-WebRequest -Uri "https://codeload.github.com/sveltia/sveltia-cms/tar.gz/$env:CMS_COMMIT" -OutFile $archive
          New-Item -ItemType Directory -Force $cmsRoot | Out-Null
          $tar = Join-Path $env:SystemRoot 'System32/tar.exe'
          & $tar -xf $archive -C $cmsRoot --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'CMS source extraction failed' }
          node scripts/patch-cms.mjs $cmsRoot
          if ($LASTEXITCODE -ne 0) { throw 'CMS source validation failed' }
          Push-Location $cmsRoot
          try {
            pnpm install --frozen-lockfile --config.package-import-method=copy --ignore-scripts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          node --test scripts/test-cms-image-converter.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CMS converter tests failed' }
          node scripts/test-cms-patch.mjs $cmsRoot
          if ($LASTEXITCODE -ne 0) { throw 'CMS patch tests failed' }
          node scripts/build-cms-release.mjs $cmsRoot (Join-Path $env:GITHUB_WORKSPACE 'public/admin/vendor/sveltia-0.227.0')
          if ($LASTEXITCODE -ne 0) { throw 'CMS build failed' }
          node scripts/verify-cms-release.mjs (Join-Path $env:GITHUB_WORKSPACE 'public/admin/vendor/sveltia-0.227.0')
          if ($LASTEXITCODE -ne 0) { throw 'CMS verification failed' }
      - name: Package release
        env:
          # Runtime reads H:/GDUFSMC-web/content. The content-snapshot sidecar
          # pairs this build with its validated data for publish and rollback.
          RELEASE_EXTERNAL_CONTENT: '1'
        run: |
          node scripts/package-release.mjs
          $code = $LASTEXITCODE
          Write-Host "package-release process exit code: $code"
          if ($code -ne 0) { exit $code }
          # Confirm the artifact really has no content/. package-release.mjs
          # removes a traced-in copy too, so this is a cheap end-to-end check
          # that the external-content build did what it claims.
          $leaked = @(Get-ChildItem .release-stage -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'content') })
          if ($leaked.Count -gt 0) {
            throw "external content build leaked content/ in: $($leaked.Name -join ', ')"
          }
          Write-Host 'verified: stage has no content/ (external mode)'
      - name: Extract release archive with Windows tar
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem outputs/*.tar.gz)
          if ($archive.Count -ne 1) { throw 'Expected one release archive' }
          # Use Windows libarchive explicitly; do not depend on PATH's tar.
          # It accepts drive-letter paths and auto-detects gzip compression
          # from the file extension (-xf with no filter flag).
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (-not (Test-Path -LiteralPath $tar)) { throw 'Windows tar.exe not found' }
          Write-Host "Extraction executable: $tar"
          & $tar --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query tar version' }
          # Keep the extracted runtime outside the checkout.
          $smoke = Join-Path $env:RUNNER_TEMP "release-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory $smoke -ErrorAction Stop | Out-Null
          Write-Host "Extracting $($archive[0].Name) ($($archive[0].Length) bytes) into $smoke"
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          & $tar -xf $archive[0].FullName -C $smoke
          if ($LASTEXITCODE -ne 0) { throw "Archive extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $smoke 'server.js'))) { throw 'Extracted server.js missing' }
          Write-Host "Extraction completed in $($timer.Elapsed.TotalSeconds) seconds"
          node scripts/verify-cms-release.mjs (Join-Path $smoke 'public/admin/vendor/sveltia-0.227.0')
          if ($LASTEXITCODE -ne 0) { throw 'Extracted CMS verification failed' }
      - name: Test extracted archive (not source workspace)
        timeout-minutes: 8
        env:
          # The archive under test has no content/. Point the smoke test at the
          # checked-out content so it probes the same tree the prod host will
          # serve from, and so its content checks actually run instead of
          # being skipped. test-release.mjs exits non-zero when CONTENT_ROOT is
          # unset, missing, or holds no markdown, which is the point: a release
          # that would come up with an empty news list must not pass CI.
          RELEASE_EXTERNAL_CONTENT: '1'
          CONTENT_ROOT: ${{ github.workspace }}
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "release-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
          Write-Host "Starting smoke test from $smoke"
          node scripts/test-release.mjs $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test image API from extracted archive
        timeout-minutes: 5
        env:
          CONTENT_ROOT: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:RUNNER_TEMP "release-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (-not (Test-Path -LiteralPath (Join-Path $smoke 'server.js'))) { throw 'Extracted server.js missing' }
          Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
          # Workspace sharp generates fixtures only. HTTP conversion must use
          # the extracted release's own dependencies, outside the checkout.
          node scripts/test-image-api.mjs $smoke outputs/image-api-http-test.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload image API test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-api-test-${{ github.sha }}-${{ github.run_attempt }}
          path: outputs/image-api-http-test.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified release and publishing tools
        id: release
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            outputs/*.tar.gz
            outputs/*.sha256.txt
            deploy/publish-release.ps1
            deploy/content-operations.ps1
            deploy/artifact-operations.ps1
            deploy/publish-from-artifacts.ps1
            deploy/process-release-queue.ps1
            deploy/submit-release.ps1
            deploy/setup-release-publish.ps1
            deploy/AUTOPUBLISH.md
            deploy/README.md
            deploy/CONTENT-SYNC.md

  publish:
    needs: build
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, gdufsmc]
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      # Deliberately no checkout or execution of downloaded scripts on the runner.
      - name: Check fixed delivery client and artifact ID
        shell: powershell
        env:
          RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.release_artifact_id }}
        run: |
          if ($env:RELEASE_ARTIFACT_ID -notmatch '^[0-9]+$') { throw 'Build returned no release artifact ID.' }
          if (-not (Test-Path -LiteralPath 'H:/GDUFSMC-web/release-tools/submit-release.ps1' -PathType Leaf)) {
            throw 'Install deploy/setup-release-publish.ps1 as Administrator before enabling RELEASE_PUBLISH_ENABLED.'
          }
      - name: Download this build's verified release
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.release_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/full-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deliver ZIP and wait for administrator publisher
        shell: powershell
        env:
          RELEASE_DOWNLOAD: ${{ runner.temp }}/full-release-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $client = 'H:/GDUFSMC-web/release-tools/submit-release.ps1'
          if (-not (Test-Path -LiteralPath $client -PathType Leaf)) {
            throw 'Install deploy/setup-release-publish.ps1 as Administrator before enabling RELEASE_PUBLISH_ENABLED.'
          }
          & $client -ArtifactDirectory $env:RELEASE_DOWNLOAD -RequestId $env:RELEASE_REQUEST_ID
