# =============================================================================
# GitHub Actions — 部署到校园服务器 (self-hosted runner + Caddy)
# =============================================================================
# 架构 (极简版, 全在 H:\GDUFSMC-web 跑):
#   1. pnpm/action-setup 装 pnpm
#   2. git fetch + reset (用 GITHUB_TOKEN) → H:\GDUFSMC-web 同步最新代码
#   3. pnpm install + typecheck + lint + pnpm build (直接写 H:\GDUFSMC-web/.next)
#   4. taskkill node + pm2 restart + health check + reload caddy
#
# 优势 vs 旧 (workspace build + robocopy + cmd move):
#   - 不需要 actions/checkout (checkout 限制 path 必须在 workspace 下)
#   - 不需要 workspace build (避免 pnpm 路径过长 + workspace 同步成本)
#   - 不需要 robocopy + cmd move (build 直接写到 H:\GDUFSMC-web/.next)
#   - GitHub Actions 跟 server 强解耦,代码同步用 GITHUB_TOKEN
#   - 不需要 download/upload artifact (服务器自己 build)
#
# Runner 配置: Settings → Actions → Runners → New self-hosted runner
#   - 标签: self-hosted, windows, gdufsmc
#   - 装到校园服务器 C:\actions-runner\
#   - 装成 Windows 服务 (deploy\setup.ps1 自动做)
#
# 触发: push 到 main (Sveltia CMS 编辑完提交也算)
#
# PowerShell shell 选择: 用 Windows PS 5.1 (校园服务器默认没装 PS 7+)
#
# git fetch 用 GITHUB_TOKEN:
#   - NetworkService 跑 git 命令, GitHub 自动注入 GITHUB_TOKEN 环境变量
#   - URL 形式 https://x-access-token:$GITHUB_TOKEN@github.com/...
#   - 这是 GitHub Actions 官方推荐的 git 凭证方式
# =============================================================================

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: '重跑原因 (写到 commit message)'
        required: false
        default: 'manual'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy (H:\GDUFSMC-web 直跑)
    runs-on: [self-hosted, windows, gdufsmc]
    if: github.event_name == 'push'
    timeout-minutes: 20
    environment:
      name: production
      url: https://gdufscraft.top

    steps:
      # Windows 长路径支持 (Next.js 16 pnpm 路径嵌套 node_modules/.pnpm/next@.../.../ 超 260 字符)
      #   不能用 --system (写 C:\Program Files\Git\etc\gitconfig, NetworkService 没权限)
      #   改用 --global (写 %USERPROFILE%\.gitconfig = C:\Windows\ServiceProfiles\NetworkService\.gitconfig)
      - name: Enable Windows long paths (>260 chars)
        shell: powershell
        run: git config --global core.longPaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 拉最新代码到 H:\GDUFSMC-web (NetworkService 跑 git, GITHUB_TOKEN 自动认证)
      #   - 不需要 actions/checkout (GitHub 限制 checkout path 必须在 workspace)
      #   - 不需要 PAT 或 SSH key (GITHUB_TOKEN 自动注入)
      - name: Sync code to H:\GDUFSMC-web
        shell: powershell
        run: |
          Push-Location H:\GDUFSMC-web
          $token = $env:GITHUB_TOKEN
          $url = "https://x-access-token:$token@github.com/QingShi-Dev/GdufsMC-Website.git"
          git remote set-url origin $url
          git fetch origin main
          git reset --hard origin/main
          # 清工作区,保留关键文件 (.git 保留, gitignore 的保留)
          git clean -fdx -e node_modules -e .next -e logs -e app -e secrets.caddy -e .env -e .next.stale
          Pop-Location

      - name: Install dependencies (含 devDependencies for build)
        working-directory: H:\GDUFSMC-web
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: H:\GDUFSMC-web
        shell: powershell
        run: pnpm typecheck

      - name: Lint
        working-directory: H:\GDUFSMC-web
        shell: powershell
        run: pnpm lint

      - name: Build Next.js (.next 写到 H:\GDUFSMC-web/.next)
        working-directory: H:\GDUFSMC-web
        shell: powershell
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build

      # 杀 node (跨账号) + 启 PM2 + 健康检查 + reload caddy
      # shell: cmd 避开 PowerShell 父进程持有 .next handle
      - name: Kill node + restart PM2
        shell: cmd
        run: |
          taskkill /F /IM node.exe 2>nul
          timeout /t 5 /nobreak >nul

      - name: Restart PM2 (Next.js)
        working-directory: H:\GDUFSMC-web
        shell: powershell
        run: |
            function Test-PathSafe([string]$p) {
                try { Test-Path $p -ErrorAction Stop } catch { $false }
            }
            $pm2Candidates = @(
                'C:\npm\pm2.cmd',
                'C:\Program Files\nodejs\pm2.cmd',
                'C:\Program Files (x86)\nodejs\pm2.cmd',
                "$env:USERPROFILE\AppData\Roaming\npm\pm2.cmd",
                'C:\Users\ks-73\AppData\Roaming\npm\pm2.cmd',
                'C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd'
            )
            $pm2 = $pm2Candidates | Where-Object { Test-PathSafe $_ } | Select-Object -First 1
            if (-not $pm2) { throw "❌ pm2.cmd 找不到" }
            $env:PATH = (Split-Path $pm2) + ';' + $env:PATH
            $ErrorActionPreference = 'Continue'
            try { & $pm2 delete gdufsmc 2>&1 | Out-Null } catch { Write-Host "  pm2 delete: $($_.Exception.Message)" }
            $LASTEXITCODE = 0
            try { & $pm2 start deploy/ecosystem.config.js 2>&1 | Out-Null } catch { Write-Host "  pm2 start: $($_.Exception.Message)" }
            $LASTEXITCODE = 0
            try { & $pm2 save 2>&1 | Out-Null } catch { Write-Host "  pm2 save: $($_.Exception.Message)" }
            $LASTEXITCODE = 0

      - name: Sync favicon
        shell: powershell
        run: |
          $ProjectDir = 'H:\GDUFSMC-web'
          $favicon = Get-ChildItem -Path "$ProjectDir\.next\static\media\favicon.*.ico" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($favicon) {
              New-Item -ItemType Directory -Path "$ProjectDir\app" -Force | Out-Null
              Copy-Item -Force $favicon.FullName "$ProjectDir\app\favicon.ico"
              Write-Host "✅ favicon 同步"
          } else {
              Write-Warning "⚠️ 找不到 favicon"
          }

      - name: Health check (wait for Next.js bind port 3000)
        shell: powershell
        run: |
          $ok = $false
          for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 3
              try {
                  $r = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/' -UseBasicParsing -TimeoutSec 5
                  if ($r.StatusCode -eq 200) {
                      Write-Host "✅ 主页就绪 (等了 $($i * 3)s)"
                      $ok = $true
                      break
                  }
              } catch { }
          }
          if (-not $ok) {
              Write-Error "❌ 主页 30s 内未就绪"
              exit 1
          }

          try {
              $api = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/api/server-status' -UseBasicParsing -TimeoutSec 5
              Write-Host "✅ API 状态: HTTP $($api.StatusCode)"
          } catch {
              Write-Warning "⚠️ API 健康检查失败, 但主页正常"
          }

      - name: Reload Caddy (only if Caddyfile changed)
        shell: powershell
        run: |
          Push-Location H:\GDUFSMC-web
          $changed = (git diff HEAD~1 HEAD --name-only 2>$null) | Where-Object { $_ -eq 'Caddyfile' }
          Pop-Location

          if ($changed -and (Get-Service -Name 'Caddy' -ErrorAction SilentlyContinue)) {
              $caddy = Get-Command caddy -ErrorAction SilentlyContinue
              if (-not $caddy) {
                  $candidates = @(
                      'C:\Program Files\Caddy\caddy.exe',
                      "$env:USERPROFILE\scoop\apps\caddy\current\caddy.exe"
                  )
                  $caddyExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
                  if ($caddyExe) { $caddy = @{ Source = $caddyExe } }
              }
              if ($caddy) {
                  & $caddy.Source reload --config 'H:\GDUFSMC-web\Caddyfile'
                  Write-Host "✅ Caddy 重载"
              } else {
                  Write-Warning "⚠️ 找不到 caddy.exe"
              }
          } else {
              Write-Host "⏭️ 跳过 Caddy reload"
          }