# Transition: build on GitHub, publish manually as the existing PM2 owner.
# Never run install/build or change services on the production runner.
name: Build release (manual publish)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Pin pnpm
        run: |
          npm install --global pnpm@12.5.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
      - name: Install full build dependencies
        run: |
          # Build from a real hoisted tree: dereferencing an isolated pnpm
          # layout relocates packages away from their sibling dependencies.
          pnpm install --prod=false --frozen-lockfile --config.node-linker=hoisted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and lint
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package release
        env:
          # Build a release with no content/ inside. The news, leaderboard,
          # and /content/... images are read at runtime from the directory
          # CONTENT_ROOT points at (H:\GDUFSMC-web\content on the prod host),
          # so editing an article becomes a file change instead of a rebuild
          # plus republish. publish-release.ps1 refuses to publish such a
          # release unless the live app already carries a valid CONTENT_ROOT,
          # so a missing env var fails the deploy instead of shipping a site
          # with an empty news list.
          RELEASE_EXTERNAL_CONTENT: '1'
        run: |
          node scripts/package-release.mjs
          $code = $LASTEXITCODE
          Write-Host "package-release process exit code: $code"
          if ($code -ne 0) { exit $code }
          # Confirm the artifact really has no content/. package-release.mjs
          # removes a traced-in copy too, so this is a cheap end-to-end check
          # that the external-content build did what it claims.
          $leaked = @(Get-ChildItem .release-stage -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'content') })
          if ($leaked.Count -gt 0) {
            throw "external content build leaked content/ in: $($leaked.Name -join ', ')"
          }
          Write-Host 'verified: stage has no content/ (external mode)'
      - name: Extract release archive with Windows tar
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem outputs/*.tar.gz)
          if ($archive.Count -ne 1) { throw 'Expected one release archive' }
          # Use Windows libarchive explicitly; do not depend on PATH's tar.
          # It accepts drive-letter paths and auto-detects gzip compression
          # from the file extension (-xf with no filter flag).
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (-not (Test-Path -LiteralPath $tar)) { throw 'Windows tar.exe not found' }
          Write-Host "Extraction executable: $tar"
          & $tar --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query tar version' }
          # Keep the extracted runtime outside the checkout.
          $smoke = Join-Path $env:RUNNER_TEMP "release-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory $smoke -ErrorAction Stop | Out-Null
          Write-Host "Extracting $($archive[0].Name) ($($archive[0].Length) bytes) into $smoke"
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          & $tar -xf $archive[0].FullName -C $smoke
          if ($LASTEXITCODE -ne 0) { throw "Archive extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $smoke 'server.js'))) { throw 'Extracted server.js missing' }
          Write-Host "Extraction completed in $($timer.Elapsed.TotalSeconds) seconds"
      - name: Test extracted archive (not source workspace)
        timeout-minutes: 8
        env:
          # The archive under test has no content/. Point the smoke test at the
          # checked-out content so it probes the same tree the prod host will
          # serve from, and so its content checks actually run instead of
          # being skipped. test-release.mjs exits non-zero when CONTENT_ROOT is
          # unset, missing, or holds no markdown, which is the point: a release
          # that would come up with an empty news list must not pass CI.
          RELEASE_EXTERNAL_CONTENT: '1'
          CONTENT_ROOT: ${{ github.workspace }}
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "release-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
          Write-Host "Starting smoke test from $smoke"
          node scripts/test-release.mjs $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test image API from extracted archive
        timeout-minutes: 5
        env:
          CONTENT_ROOT: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:RUNNER_TEMP "release-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (-not (Test-Path -LiteralPath (Join-Path $smoke 'server.js'))) { throw 'Extracted server.js missing' }
          Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
          # Workspace sharp generates fixtures only. HTTP conversion must use
          # the extracted release's own dependencies, outside the checkout.
          node scripts/test-image-api.mjs $smoke outputs/image-api-http-test.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload image API test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-api-test-${{ github.sha }}-${{ github.run_attempt }}
          path: outputs/image-api-http-test.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified release and manual publisher
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            outputs/*.tar.gz
            outputs/*.sha256.txt
            deploy/publish-release.ps1
            deploy/README.md
