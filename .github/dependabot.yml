# =============================================================================
# Dependabot version updates 配置
# =============================================================================
#
# 行为:
#   - 每周一 09:00 (Asia/Shanghai) 检查 npm 依赖更新
#   - patch + minor 合并成一个 PR (group "dependencies")
#   - major 单独 PR (默认行为, 单独 review 因为可能 breaking)
#   - GitHub-managed PR (不需要手动 review merge, 但 branch protection 要求 approval)
#
# 关联:
#   - Security updates 在 UI 里单独开 (settings/security-analysis)
#   - 这里只配 version updates + 策略
#
# 文档: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# =============================================================================

version: 2

updates:
  # ---- npm 依赖 (主) ----
  - package-ecosystem: "npm"
    directory: "/"
    # 每周一上午 9 点跑 (UTC+8), 跟 Asia/Shanghai 工作节奏一致
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # 同时保留 10 个 PR (避免太多)
    open-pull-requests-limit: 10
    # 提交信息格式: chore(deps): <message>
    commit-message:
      prefix: "chore"
      include: "scope"
    # 自动加 labels (在 PR 上显示)
    labels:
      - "dependencies"
      - "automated-pr"
    # 分组策略: patch + minor → 一个 PR; major → 单独 PR
    groups:
      dependencies:
        # patch (0.0.X) + minor (0.X.0) → 合并, 一次升一档
        update-types:
          - "minor"
          - "patch"
        # 不限制具体包, 所有 patch + minor 合并
        # 但 devDependencies 也合并进去 (统一升, 减少 PR 数)
        patterns:
          - "*"
        # 排除明确的 major (避免误升)
        exclude-patterns:
          - "*-major"
    # ---- GitHub Actions (workflow 依赖) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "automated-pr"
      - "ci"