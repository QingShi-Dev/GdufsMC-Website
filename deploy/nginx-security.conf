# =============================================================================
# /etc/nginx/conf.d/gdufsmc-security.conf
# 由 deploy/setup.sh 复制 (此文件无 ${} 占位, 不需 envsubst)
#
# 这里是 nginx http 块级别的全局配置 (limit_req_zone 必须在 http 块,
# 不能在 sites-available 的 server 块内), nginx.conf.template 是 server 块,
# 所以拆出来. nginx.conf.template 里 server 块也有 server_tokens off, 双保险.
# =============================================================================

# 隐藏 nginx 版本:
#   - Server 响应头 (默认是 "Server: nginx/1.18.0" 等)
#   - 错误页底部的 nginx 版本字串
# 让攻击者不能针对性找 nginx 版本的 CVE
server_tokens off;

# 限流 zones:
#   - $binary_remote_addr: 按客户端 IP 计数, 固定 4 字节/IP (IPv4)
#   - zone=admin:10m: ~16 万 IP 容量 (10m = 16 * 1024 IPv4 entries)
#   - 10r/s: 每个 IP 每秒最多 10 个请求
#
# 两个 zone:
#   - admin: /admin/ 路径 (CMS 后台, 严控)
#   - api:   /api/*   路径 (server-status 等, 防刷)
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;